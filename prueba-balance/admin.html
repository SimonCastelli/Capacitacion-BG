<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administración de Alumnos</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/hikalkan/jtable@2.4.0/lib/themes/metro/blue/jtable.min.css">

    <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hikalkan/jtable@2.4.0/lib/jquery.jtable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hikalkan/jtable@2.4.0/lib/localization/jquery.jtable.es.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Panel de Administración</h2>
        
        <div class="card p-4 mb-3 bg-light shadow-sm">
            <h5 class="mb-3">Filtros de búsqueda</h5>
            <div class="form-row align-items-end">
                <div class="col-md-4">
                    <label>DNI:</label>
                    <input type="text" id="f_dni" class="form-control" placeholder="Ingrese DNI...">
                </div>
                <div class="col-md-4">
                    <label>Grado:</label>
                    <select id="f_grado" class="form-control">
                        <option value="">Todos los grados</option>
                        <option value="primero">Primero</option>
                        <option value="segundo">Segundo</option>
                        <option value="tercero">Tercero</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button id="btnBuscar" class="btn btn-primary btn-block">Filtrar Tabla</button>
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4 offset-md-8">
                <button id="btnBorrarMasivo" class="btn btn-danger btn-block shadow-sm" style="display: none;">
                    Borrar Seleccionados
                </button>
            </div>
        </div>

        <div id="TablaAlumnos" class="shadow-sm"></div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
