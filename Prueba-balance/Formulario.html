<!DOCTYPE html>
<head>
    <title>Formulario</title>    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <h1 class="text-center">Formulario de Registro</h1>
    <div class="container mt-4">
        <form>
            <div class="form-group">
                <label for="Grado">Seleccione su grado:</label>
                <select class="form-control" id="Grado">
                    <option value="">Seleccione su grado</option>
                    <option value="primero">Primero</option>
                    <option value="segundo">Segundo</option>
                    <option value="tercero">Tercero</option>
                </select>
            </div>
            <div class="form-group">
                <label for="Apellido">Ingrese su apellido:</label>
                <input type="text" class="form-control" id="Apellido" placeholder="Apellido">
            </div>
            <div class="form-group">
                <label for="Nombre">Ingrese su Nombre:</label>   
                <input type="text" class="form-control" id="Nombre" placeholder="Nombre">
            </div>
            <div class="form-group">
                <label for="DNI">Ingrese su DNI:</label>
                <input type="number" class="form-control" id="DNI" placeholder="DNI">
            </div>
            <div class="form-group">
                <label for="Edad">Ingrese su edad:</label>
                <input type="number" class="form-control" id="Edad" placeholder="Edad">
            </div>
            <div class="form-group">
                <label>Seleccione su sexo:</label><br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="masculino" name="genero" value="M">
                    <label class="form-check-label" for="masculino">Masculino</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="femenino" name="genero" value="F">
                    <label class="form-check-label" for="femenino">Femenino</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="otro" name="genero" value="O">
                    <label class="form-check-label" for="otro">Otro</label>
                </div>
            </div>
            <div class="form-group">
                <label for="FechaNacimiento">Ingrese su fecha de nacimiento:</label>
                <input type="date" class="form-control" id="FechaNacimiento"  placeholder="Fecha de nacimiento">
            </div>
            <div class="form-group">
                <label for="Domicilio">Ingrese su domicilio:</label>
                <input type="text" class="form-control" id="Domicilio" placeholder="Domicilio">
            </div>
            <button type="submit" class="btn btn-primary" id="btnenviar">Enviar</button>
        </form>
    </div>
    <script src="Formulario.js"></script>
</body>
